name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install MatterFence and development tools
        run: python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest -q

      - name: Check Python linting
        run: python -m ruff check .

      - name: Run benchmarks against the secure target
        run: python -m matterfence.cli run --target secure

      - name: Build and test the installed wheel outside the checkout
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          temporary = Path(os.environ["RUNNER_TEMP"])
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          wheels = temporary / "matterfence-wheel"
          environment = temporary / "matterfence-installed"
          subprocess.run([
              sys.executable, "-m", "pip", "wheel", "--no-deps",
              "--wheel-dir", str(wheels), str(workspace),
          ], check=True)
          subprocess.run([sys.executable, "-m", "venv", str(environment)], check=True)
          python = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          wheel, = wheels.glob("*.whl")
          subprocess.run([str(python), "-m", "pip", "install", str(wheel), "pytest"], check=True)
          subprocess.run([
              str(python), "-I", "-m", "pytest", "-q", "--import-mode=importlib",
              str(workspace / "tests/test_installed_cli.py"),
              str(workspace / "tests/test_reference_app_integration.py"),
          ], cwd=temporary, check=True)
