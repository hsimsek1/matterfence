[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matterfence"
version = "0.1.0"
description = "Adversarial Security Testing for Legal AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "httpx>=0.28.1,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
matterfence = "matterfence.cli:app"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_classes = ["*TestSuite", "Check*"]
